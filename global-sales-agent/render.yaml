# Render Blueprint — one-click public deployment of GLOBAL SALES AGENT (Demo Mode)
# https://render.com/docs/blueprint-spec  → "New Blueprint" → select this repo
databases:
  - name: gsa-postgres
    plan: free
    databaseName: global_sales_agent
    user: gsa

services:
  - type: keyvalue
    name: gsa-redis
    plan: free
    ipAllowList: []

  - type: web
    name: global-sales-agent
    runtime: node
    plan: free
    rootDir: global-sales-agent
    buildCommand: npm ci && npx prisma generate && npm run build
    # migrate + idempotent seed on every deploy, then start
    startCommand: npx prisma migrate deploy && npx tsx prisma/seed.ts && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: AI_PROVIDER
        value: auto
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: WEBHOOK_SIGNING_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gsa-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gsa-redis
          property: connectionString
      - key: SEED_ADMIN_EMAIL
        value: admin@demo.local
      - key: SEED_ADMIN_PASSWORD
        value: Demo1234!
      # Optional: set ANTHROPIC_API_KEY / OPENAI_API_KEY in the dashboard to switch from Mock AI to real AI

  - type: worker
    name: global-sales-agent-worker
    runtime: node
    plan: starter
    rootDir: global-sales-agent
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: gsa-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gsa-redis
          property: connectionString
      - key: ENCRYPTION_KEY
        sync: false
